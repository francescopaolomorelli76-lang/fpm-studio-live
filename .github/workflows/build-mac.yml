# Compila FPM Studio Live sui Mac di GitHub (gratis per i repository pubblici)
# e produce "FPM-Studio-Live.zip" scaricabile da Actions → ultima esecuzione → Artifacts.
name: Build app Mac
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chiave di attivazione (dal segreto del repository, mai nel codice)
        env:
          FPM_ACTIVATION_SECRET: ${{ secrets.FPM_ACTIVATION_SECRET }}
        run: |
          if [ -n "$FPM_ACTIVATION_SECRET" ]; then
            python3 - <<'PY'
          import os
          key = os.environ["FPM_ACTIVATION_SECRET"].strip().replace(" ", "").upper().encode()
          mask = b"FPM-Studio-Live-2026"
          masked = ", ".join(str(b ^ mask[i % len(mask)]) for i, b in enumerate(key))
          src = open("FPMStudioLive/Core/LicenseSecret.swift").read()
          src = src.replace("static let masked: [UInt8] = []", "static let masked: [UInt8] = [" + masked + "]")
          open("FPMStudioLive/Core/LicenseSecret.swift", "w").write(src)
          print("Attivazione richiesta in questa versione")
          PY
          else
            echo "Nessun segreto FPM_ACTIVATION_SECRET: versione senza attivazione"
          fi
      - name: Compila (universale Intel + Apple Silicon)
        run: |
          xcodebuild -project FPMStudioLive.xcodeproj -scheme FPMStudioLive -configuration Release \
            -derivedDataPath build ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build
      - name: Impacchetta
        run: |
          cd "build/Build/Products/Release"
          ditto -c -k --keepParent "FPM Studio Live.app" "$GITHUB_WORKSPACE/FPM-Studio-Live.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FPM-Studio-Live
          path: FPM-Studio-Live.zip
